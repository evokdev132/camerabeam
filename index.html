<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0e13">
<title>Световой маяк</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen map with a floating bottom sheet; AR is a full-screen camera layer with HUD on top. Single dark look. */
:root{
  --bg:#0a0e13;
  --panel:rgba(13,19,27,.86);
  --line:rgba(150,180,210,.18);
  --fg:#e9f0f7;
  --muted:#8c9cae;
  --beam:#5ef0ff;
  --warn:#ffb547;
  --bad:#ff6b6b;
  --ok:#6ee7a8;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--beam);outline-offset:2px}

/* ---------- map view ---------- */
#map{position:fixed;inset:0;background:#1a2230}
.leaflet-container{font-family:var(--sans)}
.leaflet-control-attribution{background:rgba(10,14,19,.7)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--fg)!important}

.top-hint{
  position:fixed;z-index:500;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top,0px) + 12px);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;font-size:13px;color:var(--muted);white-space:nowrap;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.fab{
  position:fixed;z-index:500;right:calc(env(safe-area-inset-right,0px) + 14px);
  width:46px;height:46px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);display:grid;place-items:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#locateBtn{top:calc(env(safe-area-inset-top,0px) + 60px)}

.sheet{
  position:fixed;z-index:600;left:0;right:0;bottom:0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;flex-direction:column;gap:12px;
  max-width:560px;margin:0 auto;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 18px/1.1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.field::placeholder{color:var(--muted)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.primary{
  flex:1;border:0;padding:14px 18px;font-weight:800;font-size:16px;color:#04161a;
  background:var(--beam);box-shadow:0 0 24px color-mix(in srgb,var(--beam) 50%,transparent);
}
.btn.primary:disabled{opacity:.35;box-shadow:none}
.note{font-size:12.5px;color:var(--muted)}
.note.err{color:var(--bad)}
.elev-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.elev-row label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.elev-row .field{width:96px;flex:none;font-family:var(--mono);padding:8px 10px}
.elev-row .note{flex:1;min-width:150px}

/* map markers */
.wp-icon{position:relative;width:26px;height:26px}
.wp-icon i{position:absolute;inset:7px;border-radius:50%;background:var(--beam);box-shadow:0 0 12px var(--beam),0 0 2px #fff inset}
.wp-icon::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--beam);animation:ping 1.8s ease-out infinite}
.me-icon{width:18px;height:18px;border-radius:50%;background:#3b8cff;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.4)}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}

/* ---------- AR view ---------- */
#ar{position:fixed;inset:0;z-index:1000;background:#000}
#ar video,#ar canvas{position:absolute;inset:0;width:100%;height:100%}
#ar video{object-fit:cover}
.hud{
  position:absolute;left:0;right:0;top:0;z-index:2;
  padding:calc(env(safe-area-inset-top,0px) + 54px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;justify-content:center;pointer-events:none;
}
.hud-card{
  display:flex;gap:18px;padding:8px 14px;border-radius:14px;
  background:rgba(5,9,14,.55);border:1px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.hud-card .stat b{font-size:16px}
.status{
  position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);
  max-width:min(320px,calc(100% - 32px));text-align:center;
  background:rgba(5,9,14,.75);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
}
.ar-bar{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding:12px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(12px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(to top,rgba(0,0,0,.65),transparent);
}
.ar-bar .row{justify-content:center}
.ar-bar .btn{background:rgba(5,9,14,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.settings{
  background:rgba(5,9,14,.82);border:1px solid var(--line);border-radius:16px;padding:12px 14px;
  display:grid;gap:10px;max-width:520px;width:100%;margin:0 auto;
}
.settings label{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:13px}
.settings label input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--beam)}
.settings output{font:600 12px var(--mono);color:var(--muted)}
.swatches{display:flex;gap:10px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatch[aria-pressed=true]{border-color:#fff}

.toast{
  position:fixed;z-index:2000;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 200px);
  background:#151d28;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;
  max-width:calc(100% - 32px);text-align:center;
}
@media (prefers-reduced-motion:reduce){.wp-icon::after{animation:none}}
</style>
</head>
<body>

<!-- ============ MAP ============ -->
<div id="map" aria-label="Карта"></div>
<div class="top-hint" id="hint">Нажмите на карту, чтобы поставить метку</div>
<button class="fab" id="locateBtn" aria-label="Показать моё местоположение">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<section class="sheet" id="sheet">
  <div class="stats">
    <div class="stat"><span class="lbl">До метки</span><b id="mDist">—</b></div>
    <div class="stat"><span class="lbl">Азимут</span><b id="mBrg">—</b></div>
    <div class="stat"><span class="lbl">GPS</span><b id="mAcc">—</b></div>
  </div>
  <div class="row">
    <input class="field" id="wpName" placeholder="Название метки" maxlength="40" autocomplete="off">
    <input class="field" id="coordIn" placeholder="или координаты: 55.7539, 37.6208" inputmode="decimal" autocomplete="off">
  </div>
  <div class="elev-row" id="elevRow" hidden>
    <label for="wpElev">Высота метки, м</label>
    <input class="field" id="wpElev" type="number" inputmode="decimal" step="1" placeholder="…">
    <span class="note" id="elevInfo"></span>
  </div>
  <div class="row">
    <button class="btn primary" id="arBtn" disabled>Включить камеру</button>
    <button class="btn" id="clearBtn" hidden>Убрать метку</button>
  </div>
  <div class="note" id="mNote">Нужны HTTPS, доступ к геопозиции, камере и датчикам движения.</div>
</section>

<!-- ============ AR ============ -->
<section id="ar" hidden>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="hud-card">
      <div class="stat"><span class="lbl">Дистанция</span><b id="hDist">—</b></div>
      <div class="stat"><span class="lbl">Курс</span><b id="hHead">—</b></div>
      <div class="stat"><span class="lbl">Перепад</span><b id="hDz">—</b></div>
      <div class="stat"><span class="lbl">GPS</span><b id="hAcc">—</b></div>
    </div>
  </div>
  <div class="status" id="arStatus" hidden></div>
  <div class="ar-bar">
    <div class="settings" id="settings" hidden>
      <label>Угол обзора камеры (по длинной стороне) <output id="fovOut"></output>
        <input type="range" id="fov" min="40" max="100" step="1"></label>
      <label>Поправка компаса <output id="offOut"></output>
        <input type="range" id="off" min="-45" max="45" step="0.5"></label>
      <label>Высота столба <output id="hgtOut"></output>
        <input type="range" id="hgt" min="20" max="1500" step="10"></label>
      <div class="row" style="justify-content:space-between">
        <div class="swatches" id="swatches"></div>
        <button class="btn" id="resetCal">Сбросить</button>
      </div>
      <div class="note">«Смотрю на точку»: наведите центр экрана на место метки (если видите его) и нажмите. Компас подстроится.</div>
    </div>
    <div class="row">
      <button class="btn" id="backBtn">← Карта</button>
      <button class="btn" id="alignBtn">Смотрю на точку</button>
      <button class="btn" id="setBtn" aria-expanded="false">Настройки</button>
    </div>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
"use strict";
const R_EARTH = 6371000, D2R = Math.PI / 180, R2D = 180 / Math.PI;
const EYE_H = 1.5;          // camera height above ground, m
const BEAM_R = 2.5;         // beam radius, m
const COLORS = ["#5ef0ff", "#ffd35e", "#ff6bd6", "#7dff8a", "#ffffff"];
const $ = id => document.getElementById(id);

/* ---------------- state + storage ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("beacon." + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("beacon." + k, JSON.stringify(v)); } catch {} }
};
const S = {
  wp: store.get("wp", null),          // {lat, lon, name, elev, elevSrc: "dem"|"manual"}
  me: null,                            // {lat, lon, acc, alt, t}
  meElev: null,                        // {v, src: "dem"|"gps", lat, lon}
  cfg: Object.assign({ fov: 68, off: 0, hgt: 400, color: COLORS[0] }, store.get("cfg", {}))
};
const saveCfg = () => store.set("cfg", S.cfg);
document.documentElement.style.setProperty("--beam", S.cfg.color);

/* ---------------- geo math ---------------- */
function distBearing(a, b) {
  const p1 = a.lat * D2R, p2 = b.lat * D2R, dp = p2 - p1, dl = (b.lon - a.lon) * D2R;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  const d = 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(h)));
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return { d, brg: (Math.atan2(y, x) * R2D + 360) % 360 };
}
const wrap180 = a => ((a + 540) % 360) - 180;
const fmtDist = d => d == null ? "—" : d < 1000 ? Math.round(d) + " м" : (d < 10000 ? (d / 1000).toFixed(2) : (d / 1000).toFixed(1)) + " км";
const fmtDeg = a => a == null ? "—" : Math.round((a + 360) % 360) + "°";

/* ---------------- toast ---------------- */
let toastT;
function toast(msg, ms = 2600) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms);
}

/* ================= MAP ================= */
const start = S.wp ? [S.wp.lat, S.wp.lon] : [55.7539, 37.6208];
const map = L.map("map", { zoomControl: false, attributionControl: true }).setView(start, S.wp ? 16 : 13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const wpIcon = L.divIcon({ className: "", html: '<div class="wp-icon"><i></i></div>', iconSize: [26, 26], iconAnchor: [13, 13] });
const meIcon = L.divIcon({ className: "", html: '<div class="me-icon"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
let wpMarker = null, meMarker = null, accCircle = null, link = null, firstFix = true;

function setWaypoint(lat, lon, keepName) {
  const name = keepName && S.wp ? S.wp.name : ($("wpName").value.trim() || "Метка");
  const same = S.wp && S.wp.lat === lat && S.wp.lon === lon;
  S.wp = same ? Object.assign(S.wp, { name }) : { lat, lon, name, elev: null, elevSrc: null };
  store.set("wp", S.wp);
  if (S.wp.elev == null) requestWpElev();
  if (!wpMarker) {
    wpMarker = L.marker([lat, lon], { icon: wpIcon, draggable: true }).addTo(map);
    wpMarker.on("dragend", e => { const p = e.target.getLatLng(); setWaypoint(p.lat, p.lng, true); });
  } else wpMarker.setLatLng([lat, lon]);
  $("coordIn").value = lat.toFixed(6) + ", " + lon.toFixed(6);
  refreshMapInfo();
}
function clearWaypoint() {
  S.wp = null; store.set("wp", null);
  if (wpMarker) { map.removeLayer(wpMarker); wpMarker = null; }
  $("coordIn").value = "";
  refreshMapInfo();
}
function refreshMapInfo() {
  const has = !!S.wp;
  $("arBtn").disabled = !has;
  $("clearBtn").hidden = !has;
  $("hint").textContent = has ? "Метку можно перетащить" : "Нажмите на карту, чтобы поставить метку";
  $("mAcc").textContent = S.me ? "±" + Math.round(S.me.acc) + " м" : "—";
  $("elevRow").hidden = !has;
  if (has) {
    if (document.activeElement !== $("wpElev")) $("wpElev").value = S.wp.elev == null ? "" : Math.round(S.wp.elev);
    const mine = S.meElev ? "вы: " + Math.round(S.meElev.v) + " м" + (S.meElev.src === "gps" ? " (GPS)" : "") : "ваша высота: жду…";
    const dz = heightDiff();
    $("elevInfo").textContent = mine + (dz != null ? " · перепад " + fmtDz(dz) : "") + (S.wp.elevSrc === "manual" ? " · вручную" : "");
  }
  if (has && S.me) {
    const { d, brg } = distBearing(S.me, S.wp);
    $("mDist").textContent = fmtDist(d); $("mBrg").textContent = fmtDeg(brg);
    const pts = [[S.me.lat, S.me.lon], [S.wp.lat, S.wp.lon]];
    if (!link) link = L.polyline(pts, { color: S.cfg.color, weight: 2, dashArray: "6 6", opacity: .9 }).addTo(map);
    else link.setLatLngs(pts).setStyle({ color: S.cfg.color });
  } else {
    $("mDist").textContent = "—"; $("mBrg").textContent = "—";
    if (link) { map.removeLayer(link); link = null; }
  }
}

map.on("click", e => setWaypoint(e.latlng.lat, e.latlng.lng));
$("clearBtn").onclick = clearWaypoint;
$("wpName").addEventListener("input", () => { if (S.wp) { S.wp.name = $("wpName").value.trim() || "Метка"; store.set("wp", S.wp); } });
$("coordIn").addEventListener("change", () => {
  const m = $("coordIn").value.match(/(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)/);
  if (!m) { toast("Не понял координаты. Формат: 55.7539, 37.6208"); return; }
  const lat = parseFloat(m[1].replace(",", ".")), lon = parseFloat(m[2].replace(",", "."));
  if (Math.abs(lat) > 90 || Math.abs(lon) > 180) { toast("Координаты вне диапазона"); return; }
  setWaypoint(lat, lon); map.setView([lat, lon], Math.max(map.getZoom(), 16));
});
$("wpElev").addEventListener("change", () => {
  if (!S.wp) return;
  const v = parseFloat($("wpElev").value.replace(",", "."));
  if (Number.isFinite(v)) { S.wp.elev = v; S.wp.elevSrc = "manual"; store.set("wp", S.wp); refreshMapInfo(); }
  else { S.wp.elev = null; S.wp.elevSrc = null; requestWpElev(); }
});
$("locateBtn").onclick = () => S.me ? map.setView([S.me.lat, S.me.lon], Math.max(map.getZoom(), 16)) : toast("Жду сигнал GPS…");

if (S.wp) { $("wpName").value = S.wp.name || ""; setWaypoint(S.wp.lat, S.wp.lon, true); }

/* ---------------- terrain elevation (Open-Meteo, Copernicus DEM ~90 m) ---------------- */
async function fetchElev(points) {
  const q = k => points.map(p => p[k].toFixed(5)).join(",");
  const r = await fetch("https://api.open-meteo.com/v1/elevation?latitude=" + q("lat") + "&longitude=" + q("lon"));
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (!Array.isArray(j.elevation)) throw new Error("bad response");
  return j.elevation;
}
function requestWpElev() {
  const wp = S.wp; if (!wp) return;
  $("elevInfo").textContent = "Узнаю высоту рельефа…";
  fetchElev([wp]).then(([h]) => {
    if (S.wp !== wp || wp.elevSrc === "manual") return;
    wp.elev = h; wp.elevSrc = "dem"; store.set("wp", wp); refreshMapInfo();
  }).catch(() => {
    if (S.wp === wp) { $("elevInfo").textContent = "Не удалось узнать высоту — впишите её вручную."; }
  });
}
let meElevBusy = false;
function maybeFetchMyElev() {
  if (!S.me || meElevBusy) return;
  if (S.meElev && S.meElev.src === "dem" && distBearing(S.meElev, S.me).d < 40) return;
  meElevBusy = true;
  const at = { lat: S.me.lat, lon: S.me.lon };
  fetchElev([at]).then(([h]) => { S.meElev = { v: h, src: "dem", lat: at.lat, lon: at.lon }; refreshMapInfo(); })
    .catch(() => { if (S.me.alt != null && (!S.meElev || S.meElev.src === "gps")) { S.meElev = { v: S.me.alt, src: "gps", lat: at.lat, lon: at.lon }; refreshMapInfo(); } })
    .finally(() => { setTimeout(() => meElevBusy = false, 5000); });
}
// target ground height minus my ground height; null when unknown
function heightDiff() {
  if (!S.wp || S.wp.elev == null || !S.meElev) return null;
  return S.wp.elev - S.meElev.v;
}
const fmtDz = v => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(Math.round(v)) + " м";

/* ---------------- geolocation ---------------- */
if (!window.isSecureContext) {
  $("mNote").textContent = "Страница открыта не по HTTPS — браузер не даст камеру, GPS и компас.";
  $("mNote").classList.add("err");
}
if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(p => {
    S.me = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, alt: p.coords.altitude, t: p.timestamp };
    maybeFetchMyElev();
    const ll = [S.me.lat, S.me.lon];
    if (!meMarker) {
      accCircle = L.circle(ll, { radius: S.me.acc, color: "#3b8cff", weight: 1, fillOpacity: .12 }).addTo(map);
      meMarker = L.marker(ll, { icon: meIcon, interactive: false }).addTo(map);
    } else { meMarker.setLatLng(ll); accCircle.setLatLng(ll).setRadius(S.me.acc); }
    if (firstFix) { firstFix = false; if (!S.wp) map.setView(ll, 16); }
    refreshMapInfo();
  }, err => {
    $("mNote").textContent = "Геопозиция недоступна: " + (err.code === 1 ? "доступ запрещён в настройках браузера." : err.message);
    $("mNote").classList.add("err");
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 30000 });
} else {
  $("mNote").textContent = "Этот браузер не умеет определять геопозицию."; $("mNote").classList.add("err");
}

/* ================= ORIENTATION ================= */
// W3C DeviceOrientation: R = Rz(alpha)·Rx(beta)·Ry(gamma) maps device coords -> earth (x=East, y=North, z=Up).
function rotMatrix(a, b, g) {
  a *= D2R; b *= D2R; g *= D2R;
  const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
  // columns: device x, y, z expressed in ENU
  return [
    [ca * cg - sa * sb * sg, sa * cg + ca * sb * sg, -cb * sg],
    [-sa * cb, ca * cb, sb],
    [ca * sg + sa * sb * cg, sa * sg - ca * sb * cg, cb * cg]
  ];
}
// heading (deg, clockwise from north) the back camera points to; falls back to device top when held flat
function headingOf(cols) {
  const f = cols[2], fx = -f[0], fy = -f[1];
  if (Math.hypot(fx, fy) > 0.5) return (Math.atan2(fx, fy) * R2D + 360) % 360;
  const y = cols[1];
  return (Math.atan2(y[0], y[1]) * R2D + 360) % 360;
}

const O = { raw: null, src: "none", lastAbs: 0, iosOff: null, lastEvt: 0 };
function onAbsolute(e) {
  if (e.alpha == null) return;
  O.raw = { a: e.alpha, b: e.beta, g: e.gamma }; O.src = "absolute"; O.lastAbs = O.lastEvt = performance.now();
}
function onRelative(e) {
  if (e.alpha == null) return;
  const now = performance.now();
  if (now - O.lastAbs < 1000) return;              // absolute stream is alive, prefer it
  O.lastEvt = now;
  if (typeof e.webkitCompassHeading === "number" && e.webkitCompassHeading >= 0) {
    // iOS: alpha is relative, but webkitCompassHeading is magnetic heading. Derive a smoothed offset.
    const relHead = headingOf(rotMatrix(e.alpha, e.beta, e.gamma));
    const target = e.webkitCompassHeading - relHead;
    O.iosOff = O.iosOff == null ? target : O.iosOff + 0.08 * wrap180(target - O.iosOff);
    O.raw = { a: e.alpha - O.iosOff, b: e.beta, g: e.gamma }; O.src = "ios";
  } else {
    O.raw = { a: e.alpha, b: e.beta, g: e.gamma }; O.src = e.absolute ? "absolute" : "relative";
  }
}
function screenAngle() {
  const a = screen.orientation && typeof screen.orientation.angle === "number" ? screen.orientation.angle : (window.orientation || 0);
  return a * D2R;
}

// smoothed camera basis in ENU: ex = screen right, ey = screen up, ez = out of screen (camera looks along -ez)
let B = null;
const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
const cross = (u, v) => [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
function updateBasis() {
  const r = O.raw; if (!r) return false;
  const c = rotMatrix(r.a - S.cfg.off, r.b, r.g);
  const t = screenAngle(), ct = Math.cos(t), st = Math.sin(t);
  const ex = [0, 1, 2].map(i => ct * c[0][i] - st * c[1][i]);
  const ey = [0, 1, 2].map(i => st * c[0][i] + ct * c[1][i]);
  const ez = c[2];
  if (!B) { B = { ex, ey, ez }; return true; }
  const k = 0.22;    // low-pass on the rotation, then re-orthonormalise
  const lerp = (p, q) => p.map((v, i) => v + (q[i] - v) * k);
  const z = norm(lerp(B.ez, ez));
  let x = lerp(B.ex, ex); const d = dot(x, z);
  x = norm([x[0] - d * z[0], x[1] - d * z[1], x[2] - d * z[2]]);
  B = { ex: x, ey: cross(z, x), ez: z };
  return true;
}
const camHeading = () => { const fx = -B.ez[0], fy = -B.ez[1]; return (Math.atan2(fx, fy) * R2D + 360) % 360; };

/* ================= AR ================= */
const video = $("video"), cv = $("cv"), ctx = cv.getContext("2d");
let stream = null, raf = 0, wakeLock = null, arOn = false, arStart = 0;

async function startAR() {
  if (!S.wp) return;
  // iOS 13+: permission must be requested synchronously inside the tap
  let iosPerm = Promise.resolve("granted");
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    iosPerm = DeviceOrientationEvent.requestPermission().catch(() => "denied");
  }
  $("ar").hidden = false; arOn = true; arStart = performance.now();
  setStatus("Запускаю камеру…");
  const perm = await iosPerm;
  if (perm === "denied") toast("Доступ к датчикам движения отклонён — столб не сможет следовать за камерой", 4000);

  window.addEventListener("deviceorientationabsolute", onAbsolute);
  window.addEventListener("deviceorientation", onRelative);

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = stream;
    await video.play().catch(() => {});
  } catch (err) {
    setStatus("Камера недоступна: " + (err.name === "NotAllowedError" ? "доступ запрещён." : err.message || err.name));
  }
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  B = null;
  cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
}
function stopAR() {
  arOn = false; cancelAnimationFrame(raf);
  window.removeEventListener("deviceorientationabsolute", onAbsolute);
  window.removeEventListener("deviceorientation", onRelative);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  try { wakeLock?.release(); } catch {} wakeLock = null;
  $("ar").hidden = true; $("settings").hidden = true;
  O.raw = null; O.src = "none"; O.iosOff = null;
  map.invalidateSize(); refreshMapInfo();
}
document.addEventListener("visibilitychange", async () => {
  if (arOn && document.visibilityState === "visible" && !wakeLock) { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
});

let statusMsg = "";
function setStatus(msg) { if (msg === statusMsg) return; statusMsg = msg; $("arStatus").textContent = msg; $("arStatus").hidden = !msg; }

/* focal length in CSS px of the displayed (object-fit: cover) video */
function focalPx(W, H) {
  const vw = video.videoWidth || W, vh = video.videoHeight || H;
  const scale = Math.max(W / vw, H / vh);
  return (Math.max(vw, vh) / 2) / Math.tan(S.cfg.fov * D2R / 2) * scale;
}

let hudT = 0;
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const sinceStart = now - arStart;
  if (!S.me) { setStatus("Жду сигнал GPS…"); return; }
  if (!O.raw) {
    setStatus(sinceStart > 3000 ? "Нет данных датчика ориентации. Нужен телефон с гироскопом и компасом и разрешение на «Движение и ориентация»." : "Жду датчик ориентации…");
    return;
  }
  setStatus("");
  updateBasis();

  const f = focalPx(W, H), cx = W / 2, cy = H / 2;
  const { d, brg } = distBearing(S.me, S.wp);
  const drop = d * d / (2 * R_EARTH) * 0.87;   // earth curvature with standard refraction
  const e = d * Math.sin(brg * D2R), n = d * Math.cos(brg * D2R);
  const toCam = p => ({ x: dot(p, B.ex), y: dot(p, B.ey), z: -dot(p, B.ez) });
  const proj = c => ({ x: cx + f * c.x / c.z, y: cy - f * c.y / c.z });
  const NEAR = 0.8;

  const dz = heightDiff() ?? 0;
  const z0 = dz - EYE_H - drop;
  let base = toCam([e, n, z0]);
  let top = toCam([e, n, z0 + S.cfg.hgt]);
  const head = camHeading();
  const hfov = 2 * Math.atan(W / 2 / f) * R2D;
  const rel = wrap180(brg - head);
  const t = now / 1000;
  let onScreen = false;

  ctx.globalCompositeOperation = "lighter";
  if (!(base.z < NEAR && top.z < NEAR)) {
    const lerpC = (p, q, k) => ({ x: p.x + (q.x - p.x) * k, y: p.y + (q.y - p.y) * k, z: p.z + (q.z - p.z) * k });
    if (base.z < NEAR) base = lerpC(base, top, (NEAR - base.z) / (top.z - base.z));
    if (top.z < NEAR) top = lerpC(top, base, (NEAR - top.z) / (base.z - top.z));
    const pb = proj(base), pt = proj(top);
    onScreen = pb.x > -60 && pb.x < W + 60;
    drawBeam(pb, pt, f * BEAM_R / base.z, f * BEAM_R / top.z, t);
    if (d > 3) drawRings(e, n, z0, toCam, proj, NEAR, t);
    ctx.globalCompositeOperation = "source-over";
    if (onScreen) drawLabel(pb, pt, d, H);
  }
  ctx.globalCompositeOperation = "source-over";
  drawTape(W, head, brg, hfov);
  if (!onScreen) drawEdgeArrow(W, H, rel);

  if (now - hudT > 200) {
    hudT = now;
    $("hDist").textContent = fmtDist(d);
    $("hHead").textContent = fmtDeg(head);
    $("hDz").textContent = fmtDz(heightDiff());
    $("hAcc").textContent = "±" + Math.round(S.me.acc) + " м";
    if (O.src === "relative" && sinceStart > 2500 && !relWarned) { relWarned = true; toast("Браузер не даёт абсолютный компас — направление может быть неточным. Используйте «Смотрю на точку».", 5000); }
  }
}
let relWarned = false;

function drawBeam(pb, pt, wb, wt, t) {
  let dx = pt.x - pb.x, dy = pt.y - pb.y; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  const px = -dy, py = dx;
  const flicker = 1 + 0.06 * Math.sin(t * 7.3) + 0.04 * Math.sin(t * 13.1);
  // stacked additive layers give a soft, glowing falloff
  const layers = [[9, 16, .05], [5.5, 11, .07], [3.4, 7, .1], [2.1, 4.5, .16], [1.3, 3, .26], [.75, 2, .42], [.32, 1.2, .9]];
  for (let i = 0; i < layers.length; i++) {
    const [mul, minW, alpha] = layers[i];
    const core = i === layers.length - 1;
    const hb = Math.max(minW, wb * mul) * flicker / 2, ht = Math.max(minW * .6, wt * mul) * flicker / 2;
    const g = ctx.createLinearGradient(pb.x, pb.y, pt.x, pt.y);
    const col = core ? "#ffffff" : S.cfg.color;
    g.addColorStop(0, rgba(col, alpha));
    g.addColorStop(.35, rgba(col, alpha * .8));
    g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(pb.x + px * hb, pb.y + py * hb);
    ctx.lineTo(pt.x + px * ht, pt.y + py * ht);
    ctx.lineTo(pt.x - px * ht, pt.y - py * ht);
    ctx.lineTo(pb.x - px * hb, pb.y - py * hb);
    ctx.closePath(); ctx.fill();
  }
  // glow at the foot
  const r = Math.max(14, wb * 6);
  const rg = ctx.createRadialGradient(pb.x, pb.y, 0, pb.x, pb.y, r);
  rg.addColorStop(0, rgba(S.cfg.color, .55)); rg.addColorStop(1, rgba(S.cfg.color, 0));
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(pb.x, pb.y, r, 0, Math.PI * 2); ctx.fill();
}

function drawRings(e, n, z, toCam, proj, NEAR, t) {
  for (let k = 0; k < 2; k++) {
    const ph = ((t * 0.6) + k * 0.5) % 1;
    const rad = 2 + ph * 14, alpha = (1 - ph) * .7;
    ctx.beginPath(); let ok = true;
    for (let i = 0; i <= 40; i++) {
      const a = i / 40 * Math.PI * 2;
      const c = toCam([e + Math.cos(a) * rad, n + Math.sin(a) * rad, z]);
      if (c.z < NEAR) { ok = false; break; }
      const p = proj(c); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
    }
    if (!ok) continue;
    ctx.strokeStyle = rgba(S.cfg.color, alpha); ctx.lineWidth = 2; ctx.stroke();
  }
}

function drawLabel(pb, pt, d, H) {
  const name = (S.wp.name || "Метка");
  // label sits above the foot of the beam; if the foot is high on screen, put it below so it never covers the beam
  const x = pb.x, y = pb.y - 36 < 160 ? Math.min(Math.max(pb.y + 70, 160), H - 190) : Math.min(pb.y - 36, H - 190);
  ctx.font = "700 15px Manrope, system-ui, sans-serif";
  const t1 = name, t2 = fmtDist(d);
  ctx.font = "700 15px Manrope, system-ui, sans-serif"; const w1 = ctx.measureText(t1).width;
  ctx.font = "700 13px 'JetBrains Mono', monospace"; const w2 = ctx.measureText(t2).width;
  const w = Math.max(w1, w2) + 22, h = 46;
  const bx = Math.min(Math.max(x - w / 2, 8), ctx.canvas.clientWidth - w - 8);
  ctx.fillStyle = "rgba(5,9,14,.62)"; roundRect(bx, y - h, w, h, 10); ctx.fill();
  ctx.strokeStyle = rgba(S.cfg.color, .7); ctx.lineWidth = 1; ctx.stroke();
  ctx.textAlign = "center"; ctx.fillStyle = "#fff";
  ctx.font = "700 15px Manrope, system-ui, sans-serif"; ctx.fillText(t1, bx + w / 2, y - h + 19);
  ctx.font = "700 13px 'JetBrains Mono', monospace"; ctx.fillStyle = S.cfg.color; ctx.fillText(t2, bx + w / 2, y - 9);
}

function drawTape(W, head, brg, hfov) {
  // compass tape across the top of the screen
  const y0 = 8;
  const span = Math.max(hfov, 30), pxPerDeg = W / span;
  ctx.save();
  ctx.fillStyle = "rgba(5,9,14,.45)"; ctx.fillRect(0, y0 + safeTop, W, 34);
  ctx.textAlign = "center"; ctx.font = "600 11px 'JetBrains Mono', monospace";
  const startDeg = Math.floor((head - span / 2) / 5) * 5;
  for (let a = startDeg; a <= head + span / 2 + 5; a += 5) {
    const x = W / 2 + wrap180(a - head) * pxPerDeg, aa = ((a % 360) + 360) % 360;
    const major = aa % 45 === 0, mid = aa % 15 === 0;
    ctx.strokeStyle = major ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.45)";
    ctx.beginPath(); ctx.moveTo(x, y0 + safeTop); ctx.lineTo(x, y0 + safeTop + (major ? 12 : mid ? 8 : 4)); ctx.lineWidth = 1; ctx.stroke();
    if (major || mid) {
      const lab = { 0: "С", 45: "СВ", 90: "В", 135: "ЮВ", 180: "Ю", 225: "ЮЗ", 270: "З", 315: "СЗ" }[aa] || String(aa);
      ctx.fillStyle = major ? "#fff" : "rgba(255,255,255,.6)"; ctx.fillText(lab, x, y0 + safeTop + 26);
    }
  }
  const rel = wrap180(brg - head);
  if (Math.abs(rel) < span / 2) {
    const x = W / 2 + rel * pxPerDeg;
    ctx.fillStyle = S.cfg.color;
    ctx.beginPath(); ctx.moveTo(x, y0 + safeTop + 34); ctx.lineTo(x - 7, y0 + safeTop + 44); ctx.lineTo(x + 7, y0 + safeTop + 44); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W / 2, y0 + safeTop); ctx.lineTo(W / 2, y0 + safeTop + 34); ctx.stroke();
  ctx.restore();
}

function drawEdgeArrow(W, H, rel) {
  const right = rel > 0, x = right ? W - 34 : 34, y = H / 2;
  ctx.save();
  ctx.fillStyle = rgba(S.cfg.color, .9);
  ctx.beginPath();
  if (right) { ctx.moveTo(x + 16, y); ctx.lineTo(x - 8, y - 18); ctx.lineTo(x - 8, y + 18); }
  else { ctx.moveTo(x - 16, y); ctx.lineTo(x + 8, y - 18); ctx.lineTo(x + 8, y + 18); }
  ctx.closePath(); ctx.fill();
  ctx.font = "700 13px 'JetBrains Mono', monospace"; ctx.textAlign = right ? "right" : "left";
  ctx.fillStyle = "#fff"; ctx.fillText(Math.round(Math.abs(rel)) + "°", right ? W - 14 : 14, y + 40);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rgba(hex, a) {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`;
}
// safe-area top inset in px (for the compass tape)
let safeTop = 0;
(function measureSafe() {
  const p = document.createElement("div");
  p.style.cssText = "position:fixed;top:0;height:env(safe-area-inset-top,0px);visibility:hidden";
  document.body.appendChild(p); safeTop = p.offsetHeight; p.remove();
})();

/* ---------------- AR controls ---------------- */
$("arBtn").onclick = startAR;
$("backBtn").onclick = stopAR;
$("setBtn").onclick = () => { const s = $("settings"); s.hidden = !s.hidden; $("setBtn").setAttribute("aria-expanded", String(!s.hidden)); };
$("alignBtn").onclick = () => {
  if (!B || !S.me || !S.wp) { toast("Нужны GPS и датчик ориентации"); return; }
  const { brg } = distBearing(S.me, S.wp);
  const delta = wrap180(brg - camHeading());
  S.cfg.off = Math.max(-45, Math.min(45, wrap180(S.cfg.off - delta)));
  B = null; saveCfg(); syncSettings();
  toast("Компас подстроен на " + (delta > 0 ? "+" : "") + delta.toFixed(1) + "°");
};

function syncSettings() {
  $("fov").value = S.cfg.fov; $("fovOut").textContent = S.cfg.fov + "°";
  $("off").value = S.cfg.off; $("offOut").textContent = (S.cfg.off > 0 ? "+" : "") + S.cfg.off.toFixed(1) + "°";
  $("hgt").value = S.cfg.hgt; $("hgtOut").textContent = S.cfg.hgt + " м";
  [...$("swatches").children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === S.cfg.color)));
}
COLORS.forEach(c => {
  const b = document.createElement("button");
  b.className = "swatch"; b.style.background = c; b.dataset.c = c; b.setAttribute("aria-label", "Цвет " + c);
  b.onclick = () => { S.cfg.color = c; document.documentElement.style.setProperty("--beam", c); saveCfg(); syncSettings(); };
  $("swatches").appendChild(b);
});
$("fov").oninput = e => { S.cfg.fov = +e.target.value; saveCfg(); syncSettings(); };
$("off").oninput = e => { S.cfg.off = +e.target.value; B = null; saveCfg(); syncSettings(); };
$("hgt").oninput = e => { S.cfg.hgt = +e.target.value; saveCfg(); syncSettings(); };
$("resetCal").onclick = () => { S.cfg.fov = 68; S.cfg.off = 0; B = null; saveCfg(); syncSettings(); };
syncSettings();
refreshMapInfo();
})();
</script>
</body>
</html>
